name: Build on PR

on:
  pull_request:
    branches:
      - 'main'

jobs:
  build:
    name: Project Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: SetUp pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Install Dependencies
        run: pnpm install

      - name: Run Build
        run: pnpm run build